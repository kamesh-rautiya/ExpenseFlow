spring:
  datasource:
    url: jdbc:mysql://localhost:3307/database?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: user
    password: user_password
    name: expenseflow-local
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: create

  sql:
    init:
      mode: always
      continue-on-error: true
